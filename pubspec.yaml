name: windows_widgets
description: "A new Flutter project."
publish_to: 'none' 
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # architecture & state management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.2.0
  injectable: ^2.5.1

  # data & storage
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

  # ui & animations
  animations: ^2.0.11
  animated_reorderable_list: ^1.3.0
  lottie: ^3.3.1
  dropdown_button2: ^2.3.9
  fluentui_system_icons: ^1.1.273
  skeletonizer: ^2.1.0+1
  toastification: ^3.0.3

  # desktop specific
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  flutter_acrylic: ^1.1.4
  system_theme: ^3.1.2

  # file handling
  file_picker: ^10.3.3
  desktop_drop: ^0.6.1
  cross_file: ^0.3.4+2

  # utilities
  intl: ^0.20.2
  after_layout: ^1.2.0

  # native interop
  win32: ^5.10.1
  ffi: ^2.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # architecture
  build_runner: ^2.7.1
  injectable_generator: ^2.8.1

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/images/

  fonts:
    - family: Nova
      fonts:
        - asset: assets/fonts/Nova-Regular.ttf
    - family: Custom
      fonts:       
        - asset: assets/fonts/Custom.ttf
    - family: Segoe
      fonts:       
        - asset: assets/fonts/Segoe.ttf